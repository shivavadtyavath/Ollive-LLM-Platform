apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ollive

bases:
  - ../../base

# Prod: higher replicas, resource limits, TLS ingress
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
        namespace: ollive
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: backend

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
        namespace: ollive
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: frontend

  # Enable TLS in prod ingress
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: ollive-ingress
        namespace: ollive
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-prod"
      spec:
        tls:
          - hosts:
              - ollive.yourdomain.com
            secretName: ollive-tls
    target:
      kind: Ingress
      name: ollive-ingress

images:
  - name: ollive-backend
    newName: ghcr.io/shivavadtyavath/ollive-backend
    newTag: latest
  - name: ollive-frontend
    newName: ghcr.io/shivavadtyavath/ollive-frontend
    newTag: latest
